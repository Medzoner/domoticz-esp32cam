; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32cam

[esp32_base]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_web_assets.py
build_src_filter = +<main.cpp> +<core/*.cpp> +<adapters/*.cpp> +<adapters/http/*.cpp>
build_unflags = -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -Wall
    -Wextra
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem

[env:esp32cam]
extends = esp32_base
board = esp32cam
upload_speed = 460800
build_flags =
    ${esp32_base.build_flags}
    -DCAMERA_MODEL_AI_THINKER
    -DAPP_ENABLE_SD_RECORDING=1

[env:esp-eye]
extends = esp32_base
board = esp-wrover-kit
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCAMERA_MODEL_ESP_EYE

[env:esp32s3-cam-lcd]
extends = esp32_base
board = esp32s3camlcd
build_flags =
    ${esp32_base.build_flags}
    -DCAMERA_MODEL_ESP32S3_CAM_LCD

[env:m5stack-camera]
extends = esp32_base
board = esp32dev
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCAMERA_MODEL_M5STACK_PSRAM

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/*.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Werror
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem
