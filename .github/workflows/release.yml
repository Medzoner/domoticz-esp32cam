name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install PlatformIO
        run: python -m pip install --requirement requirements-ci.txt

      - name: Create build-only configuration
        run: cp include/secrets.example.h include/secrets.h

      - name: Validate release source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(cat version.txt)" = "$version"
          VERSION="$version" python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(".release-please-manifest.json").read_text())
          if manifest.get(".") != os.environ["VERSION"]:
              raise SystemExit("release tag and manifest version disagree")
          PY
          pio test --environment native
          pio check --environment native
          pio check --environment esp32cam
          for environment in esp32cam esp-eye esp32s3-cam-lcd m5stack-camera; do
            pio run --environment "$environment"
          done

      - name: Assemble release bundle
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist/package
          cp .pio/build/esp32cam/bootloader.bin dist/package/
          cp .pio/build/esp32cam/partitions.bin dist/package/
          cp .pio/build/esp32cam/firmware.bin dist/package/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin dist/package/
          printf '%s\n' \
            'esptool.py --chip esp32 --before default_reset --after hard_reset write_flash -z --flash_mode dio --flash_freq 40m --flash_size detect 0x1000 bootloader.bin 0x8000 partitions.bin 0xe000 boot_app0.bin 0x10000 firmware.bin' \
            > dist/package/flash-command.txt
          (cd dist/package && sha256sum *.bin > SHA256SUMS)
          tar -C dist/package -czf "dist/esp32cam-${RELEASE_TAG}.tar.gz" .
          for environment in esp32cam esp-eye esp32s3-cam-lcd m5stack-camera; do
            cp ".pio/build/$environment/firmware.bin" \
              "dist/esp32cam-${RELEASE_TAG}-${environment}-firmware.bin"
          done
          (cd dist && sha256sum esp32cam-*.tar.gz esp32cam-*-firmware.bin > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/esp32cam-${RELEASE_TAG}.tar.gz" \
              dist/esp32cam-*-firmware.bin \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/esp32cam-${RELEASE_TAG}.tar.gz" \
              dist/esp32cam-*-firmware.bin \
              dist/SHA256SUMS \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
