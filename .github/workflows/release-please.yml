name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs-created: ${{ steps.release.outputs.prs_created }}
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release pull request or GitHub release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate-release-pr:
    name: Validate release PR
    needs: release-please
    if: needs.release-please.outputs.prs-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch CI and report its status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
        run: |
          number="$(jq --exit-status --raw-output '.number' <<< "$RELEASE_PR")"
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
          branch="$(jq --exit-status --raw-output '.head.ref' <<< "$pull_request")"
          sha="$(jq --exit-status --raw-output '.head.sha' <<< "$pull_request")"

          check_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Test, analyze, and build' \
            -f head_sha="$sha" \
            -f status=in_progress \
            -f started_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --jq '.id')"

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

          run_id=''
          for attempt in {1..12}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$sha\") | .databaseId" \
              | head -n 1)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
              -f status=completed \
              -f conclusion=failure \
              -f completed_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
              -f 'output[title]=Release PR validation failed' \
              -f 'output[summary]=Could not locate the dispatched CI run.' >/dev/null
            exit 1
          fi

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          state=failure
          description='Release PR validation failed'
          if gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
            state=success
            description='Release PR validation passed'
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
            -f status=completed \
            -f conclusion="$state" \
            -f completed_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            -f details_url="$run_url" \
            -f "output[title]=$description" \
            -f 'output[summary]=See the dispatched CI run for tests, analysis, builds, and artifacts.' >/dev/null
          [ "$state" = success ]

  publish-firmware:
    name: Publish firmware assets
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
