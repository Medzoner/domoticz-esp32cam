name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs-created: ${{ steps.release.outputs.prs_created }}
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release pull request or GitHub release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate-release-pr:
    name: Trigger release PR validation
    needs: release-please
    if: needs.release-please.outputs.prs-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch CI for the generated branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
        run: |
          branch="$(jq --exit-status --raw-output '.headBranchName' <<< "$RELEASE_PR")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  publish-firmware:
    name: Publish firmware assets
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
