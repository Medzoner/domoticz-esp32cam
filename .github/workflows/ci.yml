name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, analyze, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install PlatformIO
        run: python -m pip install --requirement requirements-ci.txt

      - name: Create build-only configuration
        run: cp include/secrets.example.h include/secrets.h

      - name: Run native unit tests
        run: pio test --environment native

      - name: Run native static analysis
        run: pio check --environment native

      - name: Run ESP32 static analysis
        run: pio check --environment esp32cam

      - name: Build ESP32-CAM firmware
        run: pio run --environment esp32cam

      - name: Stage firmware artifacts
        run: |
          mkdir -p dist
          cp .pio/build/esp32cam/firmware.bin dist/
          cp .pio/build/esp32cam/firmware.elf dist/
          cp .pio/build/esp32cam/bootloader.bin dist/
          cp .pio/build/esp32cam/partitions.bin dist/
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
