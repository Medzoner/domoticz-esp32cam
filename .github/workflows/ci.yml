name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, analyze, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install PlatformIO
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate repository metadata
        run: |
          yamllint .github .yamllint.yml
          python -m json.tool .release-please-manifest.json >/dev/null
          python -m json.tool release-please-config.json >/dev/null
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version = Path("version.txt").read_text(encoding="utf-8").strip()
          manifest = json.loads(Path(".release-please-manifest.json").read_text())
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"invalid version.txt value: {version}")
          if manifest.get(".") != version:
              raise SystemExit("version.txt and release manifest disagree")
          PY

      - name: Create build-only configuration
        run: cp include/secrets.example.h include/secrets.h

      - name: Run native unit tests
        run: pio test --environment native

      - name: Run native static analysis
        run: pio check --environment native

      - name: Run ESP32 static analysis
        run: pio check --environment esp32cam

      - name: Build supported camera firmware
        run: |
          for environment in esp32cam esp-eye esp32s3-cam-lcd m5stack-camera; do
            pio run --environment "$environment"
          done

      - name: Stage firmware artifacts
        run: |
          mkdir -p dist
          for environment in esp32cam esp-eye esp32s3-cam-lcd m5stack-camera; do
            mkdir -p "dist/$environment"
            cp ".pio/build/$environment/firmware.bin" "dist/$environment/"
            cp ".pio/build/$environment/firmware.elf" "dist/$environment/"
            cp ".pio/build/$environment/bootloader.bin" "dist/$environment/"
            cp ".pio/build/$environment/partitions.bin" "dist/$environment/"
          done
          (cd dist && sha256sum */* > SHA256SUMS)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32cam-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
